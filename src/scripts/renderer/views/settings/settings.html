<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Настройки — профиль</title>
  <style>
    :root {
      --primary-color: #0070c9;
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 20px; color:#111; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; max-width:420px; }
    .profile-top { display:flex; gap:12px; align-items:center; }
    .avatar { width:96px; height:96px; border-radius:50%; object-fit:cover; background:#f3f4f6; }
    .profile-info { display:flex; flex-direction:column; gap:4px; }
    .btn { padding:8px 12px; border-radius:8px; border:none; cursor:pointer; }
    .btn-primary { background:var(--primary-color); color:white; }
    .btn-outline { background:white; border:1px solid #cbd5e1; }
    .controls { margin-top:12px; display:flex; gap:8px; align-items:center; }
    .muted { color:#6b7280; font-size:0.9rem; }
    .loading { opacity:0.6; filter:blur(1px); }
    .message { margin-top:8px; min-height:20px; font-size:0.9rem; }
    input[type="file"] { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Профиль</h2>
    <div class="profile-top" aria-live="polite">
      <!-- дефолтная картинка в ресурсах приложения -->
      <img id="profileImg" class="avatar" src="../../../../img/asideBar/profile.jpg" alt="Аватар пользователя" />
      <div class="profile-info">
        <div id="profileName"><strong>@username</strong></div>
        <div id="profileEmail" class="muted">example@artifact.com</div>
        <div id="profileJoined" class="muted"></div>
      </div>
    </div>

    <div class="controls">
      <label for="uploadPhoto" class="btn btn-outline" role="button">Выбрать фото...</label>
      <input id="uploadPhoto" type="file" accept="image/*" />
      <button id="uploadBtn" class="btn btn-primary" disabled>Загрузить</button>
      <button id="removePhoto" class="btn btn-outline">Удалить</button>
    </div>

    <div id="previewInfo" class="muted" style="margin-top:8px;">Максимум 2 MB. Поддерживается JPEG/PNG/GIF.</div>
    <div id="message" class="message" aria-live="polite"></div>
  </div>

  <script src="./renderer.js" defer></script>
</body>
</html>
