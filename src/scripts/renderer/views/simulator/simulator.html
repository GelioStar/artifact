<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title data-i18n="simulator.title">Simulator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/keyboard.css">
  <link rel="stylesheet" href="styles/simulator.css">
  <link rel="stylesheet" href="styles/home-card-design/card-style.css">
  <!-- AnyChart -->
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-base.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-ui.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-exports.min.js"></script>
</head>
<body>
    <main>
      <div class="dashboard" role="group">
        <div class="card timer">
          <div id="timer">60</div>
        </div>

        <div class="card simulator-setup">
          <label for="language-select" data-i18n="simulator.language_label">Language:</label>
          <select id="language-select" aria-label="Simulator language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>

          <label data-i18n="simulator.duration_label">Длительность:
            <select id="duration">
              <option>15</option>
              <option selected>30</option>
              <option>60</option>
              <option>90</option>
            </select>
          </label>

          <label><input type="checkbox" id="punct"> <span data-i18n="simulator.punctuation">Пунктуация</span></label>
        </div>

        <div class="card startBtn">
          <button id="startBtn" data-i18n="simulator.start">Старт</button>
        </div>

        <div class="card text-chart" aria-hidden="false">
          <div id="trainer" tabindex="0" aria-label="Typing trainer">
            <div id="textDisplay" class="text-display"></div>
          </div>
        </div>

        <div class="card words-per-minute" data-glow-color="0, 102, 255" aria-label="words per minute">
          <div>
            <div id="words-per-minute-label" class="label" data-i18n="simulator.words_per_minute">Слов в минуту</div>
            <div id="words-per-minute-value" class="value">0</div>
          </div>
        </div>

        <div class="card steno-keyboard" aria-label="steno keyboard">
          <div id="steno-keyboard-label" class="label" data-i18n="simulator.keyboard_label">Клавиатура</div>
          <div class="grid-container" data-glow-color="0, 102, 255">
            <!-- keyboard buttons (abbreviated; keep same markup as before) -->
            <button class="primary-button key-btn" data-key="Q" data-code="KeyQ" style="--col:1; --row:1;">S</button>
            <button class="primary-button key-btn" data-key="W" data-code="KeyW" style="--col:1; --row:2;">T</button>
            <!-- ... остальные клавиши ... -->
          </div>
        </div>

        <div class="card correct-chars" data-glow-color="0, 102, 255" aria-label="correct chars">
          <div>
            <div id="correct-chars-label" class="label" data-i18n="simulator.correct_chars_label">Число подобия</div>
            <div id="correct-chars-value" class="value">0</div>
          </div>
        </div>

        <div class="card accuracy" data-glow-color="0, 102, 255" aria-label="accuracy">
          <div>
            <div id="accuracy-label" class="label" data-i18n="simulator.accuracy_label">Точность</div>
            <div id="accuracy-value" class="value">0.0%</div>
          </div>
        </div>

        <div class="card error-chars" data-glow-color="0, 102, 255" aria-label="error chars">
          <div>
            <div id="error-chars-label" class="label" data-i18n="simulator.error_chars_label">Число ошибок</div>
            <div id="error-chars-value" class="value">0</div>
          </div>
        </div>
      </div>

      <section class="results" id="resultsPanel" hidden>
        <h2 data-i18n="simulator.results_title">Results</h2>
        <div id="chart" style="width:100%;height:360px;"></div>
        <div id="summary"></div>
        <button id="restart" data-i18n="simulator.restart">Restart</button>
      </section>
    </main>

  <!-- основной тренажёрный скрипт -->
  <script src="scripts/renderer.js" type="module"></script>
  <script src="scripts/keyboard.js" type="module"></script>

  <!-- i18n guest helper: слушаем события от webview-preload и применяем переводы -->
  <script>
    (function () {
      function resolveKey(obj, path) {
        if (!obj || !path) return null;
        return path.split('.').reduce((acc, k) => (acc && acc[k] !== undefined) ? acc[k] : null, obj);
      }
      function interpolate(str, vars = {}) {
        if (typeof str !== 'string') return str;
        return str.replace(/\{\{(\w+)\}\}/g, (_, n) => (vars[n] !== undefined ? vars[n] : ''));
      }

      function applyTranslations(translations) {
        if (!translations || typeof translations !== 'object') return;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          const raw = resolveKey(translations, key);
          if (raw === null || raw === undefined) return;
          const vars = {};
          Array.from(el.attributes).forEach(attr => {
            if (attr.name.startsWith('data-i18n-') && attr.name !== 'data-i18n') {
              vars[attr.name.slice('data-i18n-'.length)] = attr.value;
            }
          });
          el.textContent = interpolate(raw, vars);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          const raw = resolveKey(translations, key);
          if (raw === null || raw === undefined) return;
          el.setAttribute('placeholder', raw);
        });
      }

      // Когда preload-шлюз прислал событие i18n:update (через ipcRenderer -> dispatchEvent)
      window.addEventListener('i18n:update', (e) => {
        try {
          const payload = e && e.detail ? e.detail : null;
          if (!payload) return;
          // payload might be { locale, data } or raw data
          const data = payload.data || payload;
          applyTranslations(data);
          // also update language-select value if present
          const sel = document.getElementById('language-select');
          if (sel && payload.locale) sel.value = payload.locale;
        } catch (err) {
          console.error('i18n:update handler error', err);
        }
      });

      // On load, request current locale and translations from preload (if available)
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          if (window.i18n && window.i18n.getCurrent) {
            const cur = await window.i18n.getCurrent();
            // try to load translations for current locale (preload exposes loadLocale)
            if (window.i18n.loadLocale && cur) {
              const res = await window.i18n.loadLocale(cur);
              if (res && res.ok && res.data) applyTranslations(res.data);
            }
          }
        } catch (e) {
          console.error('guest i18n init error', e);
        }

        // wire up language-select in the guest (optional — sets locale via parent setCurrent through webview messaging)
        const sel = document.getElementById('language-select');
        if (sel) {
          sel.addEventListener('change', async () => {
            try {
              // prefer to ask main to set locale (exposed in host preload) via postMessage
              // webview cannot call main directly — but webview preload exposes i18n.loadLocale only.
              // We'll try to call i18n.loadLocale here to apply locally, and also send "request-locale-change" to host.
              if (window.i18n && window.i18n.loadLocale) {
                const res = await window.i18n.loadLocale(sel.value);
                if (res && res.ok && res.data) applyTranslations(res.data);
              }
              // Also notify host via custom event that host renderer can forward to main (host listens to ipc-message 'guest-request-locale')
              try {
                // send to host via postMessage on window.top — host should handle if implemented, but we also rely on user to use main controls
                window.top && window.top.postMessage && window.top.postMessage({ type: 'guest-request-locale', locale: sel.value }, '*');
              } catch (e) {}
            } catch (err) { console.error(err); }
          });
        }
      });
    })();
  </script>

  <script src="../home/scripts/home-card-design/gsap.js" defer></script>
  <script src="../home/scripts/home-card-design/script.js" defer></script>
</body>
</html>
