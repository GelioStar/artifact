<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/keyboard.css">
  <link rel="stylesheet" href="styles/simulator.css">
  <!-- AnyChart CDN for charts -->
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-base.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-ui.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-exports.min.js"></script>
    <link rel="stylesheet" href="styles/home-card-design/card-style.css">
</head>
<body>
    <main>
      <div class="dashboard" role="group">
        <div class="card timer">
          <div id="timer">60</div>
        </div>

        <div class="card simulator-setup">
          <select id="language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
          <label>Длительность:
            <select id="duration">
              <option selected>15</option>
              <option>30</option>
              <option>60</option>
              <option>90</option>
            </select>
          </label>
          <label><input type="checkbox" id="punct"> Пунктуация</label>
        </div>

      <div class="card startBtn">
        <button id="startBtn">Старт</button>
      </div>

        <div class="card text-chart" aria-hidden="false">
          <div id="trainer" tabindex="0" aria-label="Тренажёр для набора текста">
            <div id="textDisplay" class="text-display">

            </div>
          </div>
        </div>

        <div class="card words-per-minute" data-glow-color="0, 102, 255" aria-label="words per minute">
          <div>
            <div id="words-per-minute-label" class="label">Слов в минуту</div>
            <div id="words-per-minute-value" class="value">0</div>
          </div>
        </div>

        <div class="card steno-keyboard" aria-label="steno keyboard">
          <div id="steno-keyboard-label" class="label">Клавиатура</div>
          <div class="grid-container" data-glow-color="0, 102, 255">
              <button class="primary-button key-btn" data-key="Q" data-code="KeyQ" style="--col:1; --row:1;">S</button>
              <button class="primary-button key-btn" data-key="W" data-code="KeyW" style="--col:1; --row:2;">T</button>
              <button class="primary-button key-btn" data-key="E" data-code="KeyE" style="--col:1; --row:3;">P</button>
              <button class="primary-button key-btn" data-key="R" data-code="KeyR" style="--col:1; --row:4;">H</button>
              <button class="primary-button key-btn" data-key="T" data-code="KeyT" style="--col:1; --row:5;">*</button>
              <button class="primary-button key-btn" data-key="Y" data-code="KeyY" style="--col:1; --row:6;">F</button>
              <button class="primary-button key-btn" data-key="U" data-code="KeyU" style="--col:1; --row:7;">P</button>
              <button class="primary-button key-btn" data-key="I" data-code="KeyI" style="--col:1; --row:8;">L</button>
              <button class="primary-button key-btn" data-key="O" data-code="KeyO" style="--col:1; --row:9;">T</button>
              <button class="primary-button key-btn" data-key="P" data-code="KeyP" style="--col:1; --row:10;">D</button>
              <button class="primary-button key-btn" data-key="A" data-code="KeyA" style="--col:2; --row:1;">S</button>
              <button class="primary-button key-btn" data-key="S" data-code="KeyS" style="--col:2; --row:2;">K</button>
              <button class="primary-button key-btn" data-key="D" data-code="KeyD" style="--col:2; --row:3;">W</button>
              <button class="primary-button key-btn" data-key="F" data-code="KeyF" style="--col:2; --row:4;">R</button>
              <button class="primary-button key-btn" data-key="G" data-code="KeyG" style="--col:2; --row:5;">*</button>
              <button class="primary-button key-btn" data-key="H" data-code="KeyH" style="--col:2; --row:6;">R</button>
              <button class="primary-button key-btn" data-key="J" data-code="KeyJ" style="--col:2; --row:7;">B</button>
              <button class="primary-button key-btn" data-key="K" data-code="KeyK" style="--col:2; --row:8;">G</button>
              <button class="primary-button key-btn" data-key="L" data-code="KeyL" style="--col:2; --row:9;">S</button>
              <button class="primary-button key-btn" data-key=":" data-code="Semicolon" style="--col:2; --row:10;">Z</button>
              <button class="secondary-button key-btn" data-key="C" data-code="KeyC" style="--col:3; --row:3;">#</button>
              <button class="secondary-button key-btn" data-key="V" data-code="KeyV" style="--col:3; --row:4;">A</button>
              <button class="secondary-button key-btn" data-key="B" data-code="KeyB" style="--col:3; --row:5;">O</button>
              <button class="secondary-button key-btn" data-key="N" data-code="KeyN" style="--col:3; --row:6;">E</button>
              <button class="secondary-button key-btn" data-key="M" data-code="KeyM" style="--col:3; --row:7;">U</button>
              <button class="secondary-button key-btn" data-key="<" data-code="Comma" style="--col:3; --row:8;">#</button>
          </div>
        </div>

        <div class="card correct-chars" data-glow-color="0, 102, 255" aria-label="correct chars">
          <div>
            <div id="correct-chars-label" class="label">Число подобия</div>
            <div id="correct-chars-value" class="value">0</div>
          </div>
        </div>

        <div class="card accuracy" data-glow-color="0, 102, 255" aria-label="accuracy">
          <div>
            <div id="accuracy-label" class="label">Точность</div>
            <div id="accuracy-value" class="value">0.0%</div>
          </div>
        </div>

        <div class="card error-chars" data-glow-color="0, 102, 255" aria-label="error chars">
          <div>
            <div id="error-chars-label" class="label">Число ошибок</div>
            <div id="error-chars-value" class="value">0</div>
          </div>
        </div>
      </div>

      <section class="results" id="resultsPanel" hidden>
        <h2>Results</h2>
        <div id="chart" style="width:100%;height:360px;"></div>
        <div id="summary"></div>
        <button id="restart">Restart</button>
      </section>
    </main>

  <script src="scripts/renderer.js" type="module"></script>
  <script src="scripts/keyboard.js" type="module"></script>

  <script src="../home/scripts/home-card-design/gsap.js" defer></script>
  <script src="../home/scripts/home-card-design/script.js" defer></script>
</body>
</html>
