<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/keyboard.css">
  <link rel="stylesheet" href="styles/simulator.css">
  <!-- AnyChart CDN for charts -->
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-base.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-ui.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.12.0/js/anychart-exports.min.js"></script>
    <link rel="stylesheet" href="styles/home-card-design/card-style.css">
</head>
<body>
    <header>
      <h1>Typing Trainer</h1>
      <div class="controls">
        <select id="language">
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
        <label>Duration:
          <select id="duration"><option>15</option><option selected>60</option><option>120</option><option>180</option></select>
        </label>
        <label><input type="checkbox" id="punct"> Punctuation</label>
        <button id="startBtn">Start</button>
      </div>
    </header>

    <main>
      <div class="dashboard" role="group">
        <div class="card text-chart" aria-hidden="false">
          <div id="trainer" tabindex="0" aria-label="Тренажёр для набора текста">
            <div id="textDisplay" class="text-display">

            </div>
          </div>
        </div>

        <div class="card words-per-minute" aria-label="words per minute">
          <div>
            <div class="label">words-per-minute</div>
            <div class="value">120 WPM</div>
          </div>
        </div>

        <div class="card steno-keyboard" aria-label="steno keyboard">
          <div class="label">steno-keyboard</div>
        </div>

        <div class="card correct-chars" aria-label="correct chars">
          <div>
            <div class="label">correct-chars</div>
            <div class="value">450</div>
          </div>
        </div>

        <div class="card accuracy" aria-label="accuracy">
          <div>
            <div class="label">accuracy</div>
            <div class="value">98.1%</div>
          </div>
        </div>

        <div class="card error-chars" aria-label="error chars">
          <div>
            <div class="label">error-chars</div>
            <div class="value">9</div>
          </div>
        </div>
      </div>

      <div class="text-chart">
        <div id="timer">60</div>
        
      </div>

      <section class="results" id="resultsPanel" hidden>
        <h2>Results</h2>
        <div id="chart" style="width:100%;height:360px;"></div>
        <div id="summary"></div>
        <button id="restart">Restart</button>
      </section>
    </main>

  <script src="scripts/renderer.js" type="module"></script>

  <script src="../home/scripts/home-card-design/gsap.js" defer></script>
  <script src="../home/scripts/home-card-design/script.js" defer></script>
</body>
</html>
