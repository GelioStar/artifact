<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grid layout — text-chart</title>
<style>
  :root{
    --gap: 18px;
    --radius: 12px;
    --pad: 18px;
    --bg: #ffffff;
    --border: #1e1e1e;
    --muted: #6b6b6b;
  }

  /* Page reset */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:24px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: #f6f7f9;
    color: #111;
  }

  /* Grid container */
  .dashboard{
    display: grid;
    gap: var(--gap);
    grid-template-columns: 1fr 1.6fr 1.6fr 1.6fr 1fr;
    grid-template-rows: 160px 160px 240px 240px;
    grid-template-areas: 
      "text-chart       text-chart      text-chart      text-chart      text-chart"
      "text-chart       text-chart      text-chart      text-chart      text-chart"
      "words-per-minute steno-keyboard  steno-keyboard  steno-keyboard  correct-chars"
      "accuracy         steno-keyboard  steno-keyboard  steno-keyboard  error-chars";
    align-items: stretch;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Generic card style */
  .card{
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: var(--pad);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: 0 6px 20px rgba(24,24,24,0.04);
    min-height: 72px;
  }

  /* Areas */
  .text-chart{ grid-area: text-chart; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  .words-per-minute{ grid-area: words-per-minute; }
  .steno-keyboard{ grid-area: steno-keyboard; display:flex; flex-direction:column; gap:6px; }
  .correct-chars{ grid-area: correct-chars; }
  .accuracy{ grid-area: accuracy; }
  .error-chars{ grid-area: error-chars; }

  /* Specific visual tweaks to resemble диаграмму */
  .text-chart .title{
    font-size: 28px;
    font-weight:700;
    letter-spacing: .2px;
  }
  .text-chart .subtitle{
    color: var(--muted);
    font-size: 14px;
  }

  .words-per-minute .label,
  .accuracy .label,
  .correct-chars .label,
  .error-chars .label,
  .steno-keyboard .label{
    font-weight:700;
    font-size:20px;
  }

  .words-per-minute .value,
  .accuracy .value,
  .correct-chars .value,
  .error-chars .value{
    margin-top:10px;
    font-size:34px;
    font-weight:800;
  }

  /* Make steno-keyboard look like big central block with inner content */
  .steno-keyboard{
    justify-content:flex-start;
    padding: 20px;
  }
  .steno-keyboard .label{
    margin-bottom: 8px;
  }
  .steno-keyboard .keyboard-mock{
    border-radius:10px;
    border:1px dashed rgba(0,0,0,0.08);
    padding:18px;
    min-height: 140px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
  }

  /* Small screens: stack into a single column */
  @media (max-width:880px){
    .dashboard{
      grid-template-columns: 1fr;
      grid-template-rows: repeat(6, auto);
      grid-template-areas:
        "text-chart"
        "words-per-minute"
        "accuracy"
        "steno-keyboard"
        "correct-chars"
        "error-chars";
    }
    body{margin:12px}
  }
</style>
</head>
<body>

<div class="dashboard" role="group" aria-label="Layout grid example">
  <div class="card text-chart" aria-hidden="false">
    <div>
      <div class="title">text-chart</div>
      <div class="subtitle">Здесь место для графика / превью текста</div>
    </div>
  </div>

  <div class="card words-per-minute" aria-label="words per minute">
    <div>
      <div class="label">words-per-minute</div>
      <div class="value">120 WPM</div>
    </div>
  </div>

  <div class="card steno-keyboard" aria-label="steno keyboard">
    <div class="label">steno-keyboard</div>
    <div class="keyboard-mock">steno-keyboard area — большой центральный блок</div>
  </div>

  <div class="card correct-chars" aria-label="correct chars">
    <div>
      <div class="label">correct-chars</div>
      <div class="value">450</div>
    </div>
  </div>

  <div class="card accuracy" aria-label="accuracy">
    <div>
      <div class="label">accuracy</div>
      <div class="value">98%</div>
    </div>
  </div>

  <div class="card error-chars" aria-label="error chars">
    <div>
      <div class="label">error-chars</div>
      <div class="value">9</div>
    </div>
  </div>
</div>

</body>
</html>
