<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Excalidraw — layout</title>
  <style>
    :root{
      --border:#1e1e1e;
      --bg:#f5f6f7;
      --card-bg:transparent;
      --radius:14px;
      --gap:20px;
      --container-w:1200px;
      --accent:#111;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:40px 20px;
      color:var(--accent);
      -webkit-font-smoothing:antialiased;
    }

    .canvas-frame{
      width:100%;
      max-width:var(--container-w);
      border-radius:18px;
      border:2px solid var(--border);
      padding:26px;
      box-sizing:border-box;
      background:var(--card-bg);
    }

    .header{
      height:120px;
      border-radius:10px;
      border:2px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:var(--gap);
      position:relative;
      box-sizing:border-box;
    }
    .header h1{
      margin:0;
      font-size:28px;
      letter-spacing:0.2px;
      text-transform:none;
    }

    .main{
      display:grid;
      grid-template-columns: 280px 1fr 280px;
      grid-column-gap:var(--gap);
      align-items:start;
    }

    .side-card{
      height:171px;
      border-radius:12px;
      border:2px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      box-sizing:border-box;
      font-size:28px;
      text-align:center;
      padding:8px;
      background:transparent;
    }

    /* Center large card */
    .center-card{
      height:373px;
      border-radius:12px;
      border:2px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      box-sizing:border-box;
      font-size:28px;
      text-align:center;
      padding:12px;
      background:transparent;
    }

    /* Fine tuning for small screens */
    @media (max-width:980px){
      .main{grid-template-columns:1fr;}
      .side-card{width:100%;}
      .center-card{width:100%;}
      .header{height:100px}
    }

    /* Utility */
    .col-left{display:flex;flex-direction:column;gap:var(--gap)}
    .col-right{display:flex;flex-direction:column;gap:var(--gap)}

    /* Make text appearance closer to drawing (centered, medium weight) */
    .label{
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="canvas-frame">
    <div class="header" role="banner">
      <h1>text-chart</h1>
    </div>

    <div class="main">
      <!-- left column with two stacked small cards -->
      <div class="col-left">
        <div class="side-card" id="wpm">
          <div class="label">word-per-minute</div>
        </div>
        <div class="side-card" id="accuracy">
          <div class="label">accuracy</div>
        </div>
      </div>

      <!-- center large pane -->
      <div class="center-card" id="steno">
        <div class="label">steno-keyboard</div>
      </div>

      <!-- right column with two stacked small cards -->
      <div class="col-right">
        <div class="side-card" id="correct">
          <div class="label">correct-chars</div>
        </div>
        <div class="side-card" id="error">
          <div class="label">error-chars</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
