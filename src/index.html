    /* Небольшие стили для селектора локали в шапке */

    #lang-select { padding:4px 8px; border-radius:4px; }
    #lang-cycle-btn { padding:6px 10px; border-radius:4px; cursor:pointer; }

        </div>

            <li data-ripple>

            </li>
            <li data-ripple>
                <a id="messages" href="#" draggable="false" ondragstart="return false">
                    <i class='bx bxs-chat'></i>
                    <span class="links_name" data-i18n="nav.messages">Сообщения</span>
                </a>
                <span class="tooltip" data-i18n="nav.messages">Сообщения</span>
            </li>
            <li data-ripple>
                <a id="training" href="./scripts/renderer/views/simulator/simulator.html" draggable="false" ondragstart="return false">
                    <i class='bx bxs-pie-chart-alt-2'></i>
                    <span class="links_name" data-i18n="nav.training">Тренажер</span>

            </li>
            <li data-ripple>

                    <i class='bx bxs-folder'></i>
                    <span class="links_name" data-i18n="nav.news">Новости</span>

            <li data-ripple>

    <main class="home-section">
        <webview id="guest"
            src="./scripts/renderer/views/home/home.html"
            preload="./webview-preload.js"
            partition="persist:webview"
            allowpopups>

    <script src="./attribute_ripple/attribute-ripple.js"></script>
    <script src="scripts/aside-bar/aside-bar.js"></script>
    <script src="renderer.js"></script>

    <!-- i18n host helper: применяет переводы к DOM и взаимодействует с API из preload -->
    <script>
      (function () {
        // вспомогательные функции
        function resolveKey(obj, path) {
          if (!obj || !path) return null;
          return path.split('.').reduce((acc, k) => (acc && acc[k] !== undefined) ? acc[k] : null, obj);
        }
        function interpolate(str, vars = {}) {
          if (typeof str !== 'string') return str;
          return str.replace(/\{\{(\w+)\}\}/g, (_, n) => (vars[n] !== undefined ? vars[n] : ''));
        }

        function applyTranslations(translations) {
          if (!translations || typeof translations !== 'object') return;
          // textContent
          document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            const raw = resolveKey(translations, key);
            if (raw === null || raw === undefined) return;
            // collect placeholder vars from data-i18n-* attributes
            const vars = {};
            Array.from(el.attributes).forEach(attr => {
              if (attr.name.startsWith('data-i18n-') && attr.name !== 'data-i18n') {
                const varName = attr.name.slice('data-i18n-'.length);
                vars[varName] = attr.value;
              }
            });
            el.textContent = interpolate(raw, vars);
          });
          // placeholder attributes
          document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            const raw = resolveKey(translations, key);
            if (raw === null || raw === undefined) return;
            el.setAttribute('placeholder', raw);
          });
        }

        // Fill locales selector and wire up change/cycle button
        async function initLocaleControls() {
          if (!window.i18n) return;
          const sel = document.getElementById('lang-select');
          const btn = document.getElementById('lang-cycle-btn');
          try {
            const res = await window.i18n.available();
            const locales = Array.isArray(res) ? res : (res && res.locales) ? res.locales : [];
            if (!sel || !locales.length) return;
            sel.innerHTML = '';
            locales.forEach(l => sel.appendChild(new Option(l, l)));
            const curRes = await window.i18n.getCurrent();
            const cur = (typeof curRes === 'string') ? curRes : (curRes && curRes.locale) ? curRes.locale : curRes;
            if (cur && locales.includes(cur)) sel.value = cur;
            // on change
            sel.addEventListener('change', async () => {
              try { await window.i18n.setCurrent(sel.value); } catch (e) { console.error(e); }
            });
            // cycle button (local handler uses existing global cycleLocale if provided)
            btn.addEventListener('click', async () => {
              try {
                if (window.cycleLocale) await window.cycleLocale();
                else {
                  // fallback: cycle locally
                  const curVal = sel.value;
                  let idx = locales.indexOf(curVal);
                  if (idx === -1) idx = 0;
                  const next = locales[(idx + 1) % locales.length];
                  sel.value = next;
                  await window.i18n.setCurrent(next);
                }
              } catch (e) { console.error(e); }
            });
          } catch (err) {
            console.error('initLocaleControls error', err);
          }
        }

        // Apply initial translations on load and register update listener
        document.addEventListener('DOMContentLoaded', async () => {
          try {
            await initLocaleControls();

            if (window.i18n && window.i18n.getCurrent && window.i18n.load) {
              const curRes = await window.i18n.getCurrent();
              const cur = (typeof curRes === 'string') ? curRes : (curRes && curRes.locale) ? curRes.locale : curRes;
              const loadRes = await window.i18n.load(cur);
              if (loadRes && loadRes.ok && loadRes.data) {
                applyTranslations(loadRes.data);
              }
            }

            // listen for broadcasts from main (setCurrent triggers main broadcast)
            if (window.i18n && window.i18n.onUpdate) {
              window.i18n.onUpdate((payload) => {
                if (!payload) return;
                const data = payload.data || payload;
                applyTranslations(data);
                // forward to webview(s) if you want immediate local forward (main already broadcasts)
                // document.querySelectorAll('webview').forEach(wv => wv.send('i18n:update', payload));
              });
            }
          } catch (e) {
            console.error('i18n host init failed', e);
          }
        });
      })();
    </script>
</body>
</html>
