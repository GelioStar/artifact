<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Project</title>
    <link rel="stylesheet" href="styles/index.css"/>
    <link rel="stylesheet" href="./attribute_ripple/attribute-ripple.css">
    <link rel="stylesheet" href="styles/aside-bar.css">
    <link rel="stylesheet" href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="styles/home-card-design/card-style.css">
</head>
<body>
    <aside class="sidebar open">
        <div class="logo-details">
            <div class="logo_name">Artifact</div>
            <i class='bx bx-menu' id="btn"></i>
        </div>
        <ul class="nav-list">
            <li data-ripple>
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Поиск...">
                <span class="tooltip">Поиск</span>
            </li>
            <li data-ripple>
                <a id="home" href="./scripts/renderer/views/home/home.html" draggable="false" ondragstart="return false">
                    <i class='bx bxs-home'></i>
                    <span class="links_name">Главная</span>
                </a>
                <span class="tooltip">Главная</span>
            </li>
            <li data-ripple>
                <a id="game" href="#" draggable="false" ondragstart="return false">
                    <i class='bx bxs-grid-alt'></i>
                    <span class="links_name">Играть</span>
                </a>
                <span class="tooltip">Играть</span>
            </li>
            <!-- <li data-ripple>
                <a href="#" draggable="false" ondragstart="return false">
                    <i class='bx bxs-user'></i>
                    <span class="links_name">Профиль</span>
                </a>
                <span class="tooltip">Профиль</span>
            </li> -->
            <li data-ripple>
                <a id="messages" href="#" draggable="false" ondragstart="return false">
                    <i class='bx bxs-chat'></i>
                    <span class="links_name">Сообщения</span>
                </a>
                <span class="tooltip">Сообщения</span>
            </li>
            <li data-ripple>
                <a id="training" href="./scripts/renderer/views/simulator/index.html" draggable="false" ondragstart="return false">
                    <i class='bx bxs-pie-chart-alt-2'></i>
                    <span class="links_name">Тренажер</span>
                </a>
                <span class="tooltip">Тренажер</span>
            </li>
            <li data-ripple>
                <a id="news" href="#" draggable="false" ondragstart="return false">
                    <i class='bx bxs-folder'></i>
                    <span class="links_name">Новости</span>
                </a>
                <span class="tooltip">Новости</span>
            </li>
            <li data-ripple>
                <a id="settings" href="#settings" draggable="false" ondragstart="return false">
                    <i class='bx bxs-cog'></i>
                    <span class="links_name">Настройки</span>
                </a>
                <span class="tooltip">Настройки</span>
            </li>
            <li class="profile">
                <div class="profile-details">
                    <img src="img/logo.png" alt="profileImg">
                    <div class="name_job">
                        <div class="username">@username</div>
                    </div>
                </div>
                <i id="log_out" class='bx bx-log-out-circle'>
                </i>
            </li>
        </ul>
    </aside>


    <main class="home-section">
        <webview id="guest" src="./scripts/renderer/views/home/home.html" preload="./webview-preload.js" partition="persist:webview" allowpopups style="width:100%; height:100%;"></webview>
    </main>

<script src="./attribute_ripple/attribute-ripple.js"></script>
    <script src="scripts/aside-bar/aside-bar.js"></script>
    <script src="renderer.js"></script>

    
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/renderer/routing/route.js"></script>
    <script src="scripts/renderer/routing/router.js"></script>
    <script src="scripts/renderer/routing/app.js"></script> -->
</body>
</html>
